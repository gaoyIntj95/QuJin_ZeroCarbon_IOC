name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Ensure Cesium assets are published at the project root
        run: |
          mkdir -p dist/cesium
          cp -R node_modules/cesium/Build/Cesium/. dist/cesium/
      - name: Support SPA deep links
        run: |
          cp dist/index.html dist/404.html
          mkdir -p dist/overview dist/energy-flow dist/carbon-trend
          cp dist/index.html dist/overview/index.html
          cp dist/index.html dist/energy-flow/index.html
          cp dist/index.html dist/carbon-trend/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
